<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="284" viewBox="0 0 1200 284" role="img" aria-labelledby="t d"><title id="t">OpsAgent — explore the demo</title><desc id="d">An illustrated AI application workspace with connected tools. Link opens the existing OpsAgent demo.</desc><defs>
