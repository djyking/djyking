  .mono { font-family: 'Cascadia Code', Consolas, monospace; }
  .float { animation: float 6s ease-in-out infinite; }
  .float2 { animation: float 7.5s ease-in-out infinite -2s; }
  .pulse { animation: pulse 4.5s ease-in-out infinite; }
  .flow { stroke-dasharray: 4 9; animation: flow 9s linear infinite; }
  .cursor { animation: blink 1.6s steps(1) infinite; }
  .steam { animation: steam 4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  @keyframes pulse { 0%,100% { opacity:.4 } 50% { opacity:1 } }
  @keyframes flow { to { stroke-dashoffset:-104 } }
  @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
  @keyframes steam { 0%,100% { opacity:.22 } 50% { opacity:.65 } }
  @media (prefers-reduced-motion: reduce) { .float,.float2,.pulse,.flow,.cursor,.steam { animation:none } }
