<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">He Yu — a personal engineering workbench</title>
<desc id="desc">An original illustrated night workspace with a black-haired engineer wearing glasses, a code editor, AI graph, and data notebook. Gentle animations are decorative.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09131f"/><stop offset=".55" stop-color="#111b30"/><stop offset="1" stop-color="#152a3b"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182b3c"/><stop offset="1" stop-color="#0e1a2b"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ee7d0"/><stop offset=".56" stop-color="#64bfe3"/><stop offset="1" stop-color="#ae9eea"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b2fff0" stop-opacity=".17"/><stop offset="1" stop-color="#5cc4db" stop-opacity=".025"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#56ddc7" stop-opacity=".13"/><stop offset="1" stop-color="#56ddc7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#94bbd1" stroke-opacity=".045"/></pattern>

  <linearGradient id="window" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a2547"/><stop offset="1" stop-color="#243c55"/></linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#40666b"/><stop offset="1" stop-color="#254451"/></linearGradient>
  <radialGradient id="lamp"><stop stop-color="#ffd6a0" stop-opacity=".25"/><stop offset="1" stop-color="#ffbd79" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="1200" height="480" rx="20"/></clipPath>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
  .mono { font-family: 'Cascadia Code', Consolas, monospace; }
  .float { animation: float 6s ease-in-out infinite; }
  .float2 { animation: float 7.5s ease-in-out infinite -2s; }
  .pulse { animation: pulse 4.5s ease-in-out infinite; }
  .flow { stroke-dasharray: 4 9; animation: flow 9s linear infinite; }
  .cursor { animation: blink 1.6s steps(1) infinite; }
  .steam { animation: steam 4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  @keyframes pulse { 0%,100% { opacity:.4 } 50% { opacity:1 } }
  @keyframes flow { to { stroke-dashoffset:-104 } }
  @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
  @keyframes steam { 0%,100% { opacity:.22 } 50% { opacity:.65 } }
  @media (prefers-reduced-motion: reduce) { .float,.float2,.pulse,.flow,.cursor,.steam { animation:none } }
</style>
